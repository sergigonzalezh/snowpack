[GENERAL]
BUFF_CHUNK_SIZE		=	370
BUFF_BEFORE		=	0.0

[INPUT]
COORDSYS		=	UPS
COORDPARAM		=	S
TIME_ZONE		=	0

METEO			=	SMET
METEOPATH		=	./smet/
SNOWPATH		=	./current_snow/
ISWR_IS_NET		=	FALSE
SNOW			=	SMET

; PSUM_PH in SMET files has invalid WMO codes (5.0) - must EXCLUDE then CREATE
; The ::create directive doesn't work when PSUM_PH already exists in the file

[InputEditing]
; First exclude the invalid PSUM_PH from input
*::edit1 = EXCLUDE
*::arg1::params = PSUM_PH

; Then create correct PSUM_PH from temperature using PRECSPLITTING
*::edit2 = CREATE
*::arg2::algorithm = PRECSPLITTING
*::arg2::param     = PSUM_PH
*::arg2::type      = THRESH
*::arg2::snow      = 274.35

; Copy VW to VW_DRIFT for drift calculations
*::edit3      = COPY
*::arg3::dest = VW_DRIFT
*::arg3::src  = VW


[OUTPUT]
COORDSYS		=	UPS
COORDPARAM		=	S
TIME_ZONE		=	0

METEOPATH		=	./output
WRITE_PROCESSED_METEO	=	TRUE
SNOW			=	SMET
BACKUP_DAYS_BETWEEN	=	365
FIRST_BACKUP		=	365
LABEL_SNOW		=	FALSE

PROF_WRITE		=	TRUE
PROF_FORMAT		=	PRO
AGGREGATE_PRO		=	TRUE
AGGREGATE_PRF		=	FALSE
PROF_START		=	0
PROF_DAYS_BETWEEN	=	28
HARDNESS_IN_NEWTON	=	FALSE
CLASSIFY_PROFILE	=	FALSE

TS_WRITE		=	TRUE
TS_FORMAT		=	SMET
TS_START		=	0
TS_DAYS_BETWEEN		=	0.25
AVGSUM_TIME_SERIES	=	TRUE
CUMSUM_MASS		=	FALSE
PRECIP_RATES		=	TRUE
OUT_CANOPY		=	FALSE
OUT_HAZ			=	FALSE
OUT_SOILEB		=	FALSE
OUT_HEAT		=	TRUE
OUT_T			=	TRUE
OUT_LW			=	TRUE
OUT_SW			=	TRUE
OUT_MASS		=	TRUE
OUT_METEO		=	TRUE
OUT_STAB		=	TRUE
OUT_DHS			=	FALSE
METEO			=	SMET

EXPERIMENT		=	NO_EXP

[SNOWPACK]
CALCULATION_STEP_LENGTH	=	60	;cf interactions with HNW::accumulate
FORCING			=	ATMOS
ROUGHNESS_LENGTH	=	0.002
HEIGHT_OF_METEO_VALUES	=	2
HEIGHT_OF_WIND_VALUE	=	10
ENFORCE_MEASURED_SNOW_HEIGHTS	=	FALSE
SW_MODE			=	INCOMING
ATMOSPHERIC_STABILITY	=	MO_MICHLMAYR
CANOPY			=	FALSE
MEAS_TSS		=	FALSE
CHANGE_BC		=	FALSE	; Keep Dirichlet BC like reference study
SNP_SOIL		=	FALSE	; No soil layers during spinup
GEO_HEAT		=	0.0	; Zero heat flux - good assumption at depths >10m
THRESH_CHANGE_BC	=	-1.0
SOIL_FLUX		=	TRUE	; Disable to prevent water infiltration into soil

[SNOWPACKADVANCED]
ASSUME_RESPONSIBILITY	=	AGREE
ADJUST_HEIGHT_OF_METEO_VALUES	=	FALSE
ADJUST_HEIGHT_OF_WIND_VALUE	=	FALSE
VARIANT = POLAR	; Use Antarctic-specific parameterizations
SNOW_EROSION		=	NONE
SNOW_EROSION_FETCH_LENGTH	=	10
SNOW_EROSION_LIMIT	=	-1
MAX_SIMULATED_HS	=	15
WIND_SCALING_FACTOR	=	0.3	; Scale down ERA5 winds to achieve realistic mass balance
NUMBER_SLOPES		=	1
PERP_TO_SLOPE		=	FALSE
ALLOW_ADAPTIVE_TIMESTEPPING	=	TRUE
THRESH_RAIN		=	1.2	; Antarctic threshold (PSUM_PH=0 in SMET ensures snow)
FORCE_ADD_SNOWFALL	=	TRUE
FORCE_RH_WATER		=	FALSE
THRESH_RH		=	0.5
THRESH_DTEMP_AIR_SNOW	=	3
HOAR_THRESH_TA		=	1.2
HOAR_THRESH_RH		=	0.97
HOAR_THRESH_VW		=	3.5
HOAR_DENSITY_BURIED	=	125
HOAR_MIN_SIZE_BURIED	=	2
HOAR_DENSITY_SURF	=	100
MIN_DEPTH_SUBSURF	=	0.07
T_CRAZY_MIN		=	150
T_CRAZY_MAX		=	340
METAMORPHISM_MODEL	=	DEFAULT
NEW_SNOW_GRAIN_SIZE	=	0.3
STRENGTH_MODEL		=	DEFAULT
VISCOSITY_MODEL		=	DEFAULT
SALTATION_MODEL		=	SORENSEN
ENABLE_VAPOUR_TRANSPORT	=	FALSE
WATERTRANSPORTMODEL_SNOW	=	BUCKET
WATERTRANSPORTMODEL_SOIL	=	BUCKET
AVG_METHOD_HYDRAULIC_CONDUCTIVITY	=	GEOMETRICMEAN
;LB_COND_WATERFLUX	=	FREEDRAINAGE
;FIXED_POSITIONS	= 
; use 320 kg m-3 for fixed density
HN_DENSITY		=	PARAMETERIZED
HN_DENSITY_PARAMETERIZATION	=	LEHNING_NEW
ALBEDO_AGING		=	TRUE
SW_ABSORPTION_SCHEME	=	MULTI_BAND
HARDNESS_PARAMETERIZATION	=	MONTI
DETECT_GRASS		=	FALSE
PLASTIC			=	FALSE
JAM			=	FALSE
WATER_LAYER		=	FALSE
HEIGHT_NEW_ELEM		=	0.02
MINIMUM_L_ELEMENT	=	0.0025
REDUCE_N_ELEMENTS	=	3
COMBINE_ELEMENTS	=	TRUE
TWO_LAYER_CANOPY	=	FALSE
CANOPY_HEAT_MASS	=	FALSE
CANOPY_TRANSMISSION	=	FALSE
FORESTFLOOR_ALB		=	FALSE
ADVECTIVE_HEAT		=	FALSE

MAX_NUMBER_MEAS_TEMPERATURES	=	7

[FILTERS]
TA::filter1		=	min_max
TA::arg1::min		=	190 
TA::arg1::max		=	280 
TA::arg1::soft		=	FALSE

RH::filter1		=	min_max
RH::arg1::min		=	0.01 
RH::arg1::max		=	2.0
RH::arg1::soft		=	FALSE
RH::filter2		=	min_max
RH::arg2::min		=	0.01 
RH::arg2::max		=	1.0 
RH::arg2::soft		=	TRUE

; ILWR: ERA5 strd is hourly accumulated J/m², MeteoIO divides by 6hr (21600s)
; Multiply by 6 to correct: 18 W/m² * 6 = 108 W/m² (realistic for Antarctica)
ILWR::filter1		=	mult
ILWR::arg1::type	=	CST
ILWR::arg1::cst		=	6
ILWR::filter2		=	min_max
ILWR::arg2::min		=	30
ILWR::arg2::max		=	400
ILWR::arg2::soft	=	FALSE
ILWR::filter3		=	min_max
ILWR::arg3::min		=	50
ILWR::arg3::max		=	350
ILWR::arg3::soft	=	TRUE

TSS::filter1		=	min_max
TSS::arg1::min		=	180 
TSS::arg1::max		=	275 
TSS::arg1::soft		=	FALSE

TSG::filter1		=	min_max
TSG::arg1::min		=	200 
TSG::arg1::max		=	275 
TSG::arg1::soft		=	FALSE

; ISWR: ERA5 ssrd is hourly accumulated J/m², MeteoIO divides by 6hr (21600s)
; Multiply by 6 to correct the unit conversion
ISWR::filter1		=	mult
ISWR::arg1::type	=	CST
ISWR::arg1::cst		=	6
ISWR::filter2		=	min_max
ISWR::arg2::min		=	-10
ISWR::arg2::max		=	1500
ISWR::arg2::soft	=	FALSE
ISWR::filter3		=	min_max
ISWR::arg3::min		=	0
ISWR::arg3::max		=	1500
ISWR::arg3::soft	=	TRUE

; Scale down ERA5 winds by 50% (ERA5 winds seem too high for this location)
VW::filter1		=	mult
VW::arg1::type		=	CST
VW::arg1::cst		=	0.5
VW::filter2		=	min_max
VW::arg2::min		=	-2
VW::arg2::max		=	70
VW::arg2::soft		=	FALSE
VW::filter3		=	min_max
VW::arg3::min		=	0
VW::arg3::max		=	50
VW::arg3::soft		=	TRUE

RSWR::filter1		=	min_max
RSWR::arg1::min		=	-10 
RSWR::arg1::max		=	1500 
RSWR::arg1::soft	=	FALSE
RSWR::filter2		=	min_max
RSWR::arg2::min		=	0 
RSWR::arg2::max		=	1500 
RSWR::arg2::soft	=	TRUE

[INTERPOLATIONS1D]
ENABLE_RESAMPLING		=	TRUE
WINDOW_SIZE			=	439200	;that is 5 d and 2 h; 1 d = 86400

DW::resample1			=	nearest
DW::arg1::extrapolate		=	TRUE

RHO_HN::resample1		=	none

VW::resample1			=	nearest
VW::arg1::extrapolate		=	TRUE

HS::resample1			=	linear
HS::arg1::window_size		=	219600

TSG::resample1			=	linear
TSG::arg1::window_size		=	219600 

; Use nearest neighbor - each hourly step gets 1/6 of the 6-hourly precipitation
PSUM::resample1			=	nearest 

[GENERATORS]
; TSG (ground surface temp) - use cold constant appropriate for Antarctic interior
; Without soil layers, this is the lower boundary temp
TSG::generator1			=	CST
TSG::arg1::value		=	230.0	; About -43°C - typical Antarctic subsurface

RH::generator1			=	HUMIDITY
RH::arg1::type			=	RH

; PSUM_PH now using create directive in [INPUT] section

; Wind data now available in SMET files (VW and DW extracted from ERA5 u10/v10)
