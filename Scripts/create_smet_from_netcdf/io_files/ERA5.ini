IMPORT_AFTER		=	../station_list.lst
IMPORT_BEFORE		=	./base.ini

[INPUT]
COORDSYS		=	PROJ
COORDPARAM		=	3031
TIME_ZONE		=	0
NETCDF_SCHEMA		=	CF-1.6
NETCDF_SCHEMA_DEM	=	CF-1.6
DEM			=	NETCDF
DEMVAR			=	Topography
DEMFILE			=	/capstor/store/cscs/userlab/s1329/DATA_ANT_CLIM/ERA5_DEM.nc
SOURCE_DEM		=	/capstor/store/cscs/userlab/s1329/DATA_ANT_CLIM/ERA5_DEM.nc
GRID2D			=	NETCDF
NC_EXT			=	.nc
NC_DEBUG		=	FALSE

METEO			=	NETCDF
; Original paths with split files (instant + accum):
; METEOPATH		=	/capstor/store/cscs/userlab/s1329/DATA_ANT_CLIM/ERA5_3hourly_1980_2024/
; GRID2DPATH		=	/capstor/store/cscs/userlab/s1329/DATA_ANT_CLIM/ERA5_3hourly_1980_2024/

; Merged files (instant + accum combined, includes wind u10/v10):
METEOPATH		=	/capstor/scratch/cscs/gsergi/CRYOWRF_ANT_CLIM/snowpack/Scripts/create_smet_from_netcdf/input/ERA5_merged/
GRID2DPATH		=	/capstor/scratch/cscs/gsergi/CRYOWRF_ANT_CLIM/snowpack/Scripts/create_smet_from_netcdf/input/ERA5_merged/

NETCDF_VAR::DEM		=	Topography
NETCDF_VAR::TA		=	t2m
NETCDF_VAR::TD		=	d2m
NETCDF_VAR::U		=	u10
NETCDF_VAR::V		=	v10
NETCDF_VAR::ISWR	=	ssrd
NETCDF_VAR::ILWR	=	strd
NETCDF_VAR::PSUM	=	tp
; Removed: NETCDF_VAR::PSUM_PH = ptype (ERA5 ptype uses WMO codes 0-8, not 0-1 fraction)
; PSUM_PH is now generated via PPHASE algorithm in [Interpolations2D] section
NETCDF_VAR::P		=	sp

NETCDF_DIM::LONGITUDE	=	longitude
NETCDF_DIM::LATITUDE	=	latitude
NETCDF_DIM::TIME	=	valid_time
NETCDF_VAR::LONGITUDE	=	longitude
NETCDF_VAR::LATITUDE	=	latitude
NETCDF_VAR::TIME	=	valid_time

ISWR_IS_NET		=	FALSE
SNOWPATH		=	../input/
SNOW			=	SMET

[INPUTEDITING]
RESAMPLING_STRATEGY	=	GRID_EXTRACT
; PSUM_PH is generated via PRECSPLITTING data creator (not from grid)
Virtual_parameters	=	TA RH VW DW ISWR ILWR PSUM P
VSTATIONS_REFRESH_RATE	=	21600
VSTATIONS_REFRESH_OFFSET=	3600

; Create PSUM_PH using PRECSPLITTING based on temperature threshold
; This generates PSUM_PH from PSUM and TA after grid extraction
PSUM_PH::create			=	PRECSPLITTING
PSUM_PH::PRECSPLITTING::type	=	THRESH
PSUM_PH::PRECSPLITTING::snow	=	274.35

[FILTERS]
; ERA5 tp is in meters, but MeteoIO automatically converts to mm for PSUM.
; No explicit conversion needed - MeteoIO handles this internally.

[OUTPUT]
COORDSYS		=	PROJ
COORDPARAM		=	3031
TIME_ZONE		=	0
METEO			=	SMET
SMET_WRITEMODE		=	OVERWRITE
SMET_PLOT_HEADERS	=	FALSE
METEOPATH		=	../output/
